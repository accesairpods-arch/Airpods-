<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | AirPods Quito</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#fff;font-family:Arial}.wrap{width:min(1100px,94%);margin:auto}header{padding:20px 0;border-bottom:1px solid #292c34}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.card{background:#12141a;border:1px solid #292c34;border-radius:16px;padding:20px;margin-top:18px}input{width:100%;padding:11px;margin:6px 0 12px;border-radius:9px;border:1px solid #30333c;background:#0b0c10;color:#fff}button,a{padding:10px 13px;border:0;border-radius:9px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#fff;color:#111}.dark{background:#272a32;color:#fff}.danger{background:#ff5b67;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid #292c34;text-align:left}.hidden{display:none}.muted{color:#999;font-size:.9rem}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap row"><b>AIRPODS QUITO · ADMIN</b><a class="dark" href="/">Ver tienda</a></div></header><div class="wrap">
<div id="login" class="card" style="max-width:420px;margin:70px auto"><h2>Acceso</h2><input id="user" placeholder="Usuario"><input id="pass" type="password" placeholder="Contraseña"><button class="primary" onclick="login()">Entrar</button><p id="err"></p></div>
<main id="app" class="hidden"><div class="grid"><section class="card"><h2>Configuración</h2><label>WhatsApp</label><input id="wa"><button class="primary" onclick="saveSettings()">Guardar</button></section><section class="card"><h2>Nuevo producto</h2><input id="name" placeholder="Nombre"><input id="description" placeholder="Descripción"><input id="price" type="number" step=".01" placeholder="Precio"><input id="oldPrice" type="number" step=".01" placeholder="Precio anterior"><input id="badge" placeholder="Etiqueta"><label>Imagen</label><input id="image" type="file" accept="image/*"><button class="primary" onclick="addProduct()">Agregar</button></section></div><section class="card"><h2>Productos</h2><table><thead><tr><th>Producto</th><th>Precio</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></section><p class="muted">La autenticación se maneja mediante sesión de servidor. Cambia ADMIN_PASSWORD y SESSION_SECRET antes de publicar.</p></main></div>
<script>
let db;
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});if(!r.ok)throw new Error((await r.json().catch(()=>({error:"Error"}))).error);return r.json()}
async function login(){try{await api("/api/login",{method:"POST",body:JSON.stringify({username:document.getElementById("user").value,password:document.getElementById("pass").value})});show()}catch(e){document.getElementById("err").textContent=e.message}}
async function show(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");db=await api("/api/admin");document.getElementById("wa").value=db.settings.whatsapp;render()}
async function saveSettings(){await api("/api/settings",{method:"POST",body:JSON.stringify({whatsapp:document.getElementById("wa").value})});alert("Guardado")}
async function addProduct(){let file=document.getElementById("image").files[0],image="";if(file){let fd=new FormData();fd.append("image",file);let r=await fetch("/api/upload",{method:"POST",body:fd});image=(await r.json()).url}let p={name:name.value,description:description.value,price:price.value,oldPrice:oldPrice.value,badge:badge.value,image,active:true};await api("/api/products",{method:"POST",body:JSON.stringify(p)});db=await api("/api/admin");render();document.querySelectorAll("#name,#description,#price,#oldPrice,#badge").forEach(x=>x.value="");document.getElementById("image").value=""}
async function del(id){if(confirm("¿Eliminar producto?")){await api("/api/products/"+id,{method:"DELETE"});db=await api("/api/admin");render()}}
async function toggle(id,active){await api("/api/products/"+id,{method:"PUT",body:JSON.stringify({active:!active})});db=await api("/api/admin");render()}
async function edit(id){let p=db.products.find(x=>x.id===id),n=prompt("Nombre",p.name),pr=prompt("Precio",p.price);if(n===null)return;await api("/api/products/"+id,{method:"PUT",body:JSON.stringify({name:n,price:Number(pr)})});db=await api("/api/admin");render()}
function render(){rows.innerHTML=db.products.map(p=>`<tr><td><b>${p.name}</b><br><span class="muted">${p.description||""}</span></td><td>$${Number(p.price).toFixed(2)}</td><td><button class="dark" onclick="edit(${p.id})">Editar</button> <button class="dark" onclick="toggle(${p.id},${p.active})">${p.active?"Ocultar":"Mostrar"}</button> <button class="danger" onclick="del(${p.id})">Eliminar</button></td></tr>`).join("")}
</script></body></html>
